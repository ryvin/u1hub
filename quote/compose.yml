# u1-quote: the public quote page (docs/quote.md). Reached ONLY through the
# Cloudflare tunnel (quote.satisfyingprints3d.com -> http://u1-quote:4560): no
# port is published on the host, so nobody on the LAN can reach it around the
# tunnel and set their own CF-Connecting-IP (final review, Important 2). It
# joins the tunnel container's network (snapmaker-cloudflared runs in the
# YT_Steam_Manager compose project, network yt_steam_manager_default) and
# reaches the Hub through the host's published :4545.
name: u1-quote
services:
  u1-quote:
    build: .
    container_name: u1-quote
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4560"
      HUB_URL: http://host.docker.internal:4545
      TRUST_CF: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [tunnel]
    read_only: true
    tmpfs: [/tmp]
networks:
  tunnel:
    external: true
    name: yt_steam_manager_default
