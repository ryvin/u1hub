# u1-quote: the public quote page (docs/quote.md). Reached only through the
# Cloudflare tunnel (quote.satisfyingprints3d.com -> host.docker.internal:4560).
name: u1-quote
services:
  u1-quote:
    build: .
    container_name: u1-quote
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4560"
      HUB_URL: http://host.docker.internal:4545
      TRUST_CF: "1"
    ports:
      - "4560:4560"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: [/tmp]
networks:
  default:
    ipam:
      config:
        # 10.215 is pihole_default, 10.213-10.218 are taken: 10.219 was free on 2026-10-07 (infra-collision-audit)
        - subnet: 10.219.0.0/24
